<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="PHAM HOANG CHUONG — Java 21 Backend Engineer">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0e75b6" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DB33F" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6DB33F" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6DB33F" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e75b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6DB33F" stop-opacity="1"/>
      <stop offset="1" stop-color="#0e75b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6DB33F" stop-opacity="0"/>
      <stop offset="1" stop-color="#6DB33F" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="14"/></clipPath>
    <clipPath id="typing">
      <rect x="250" y="190" width="0" height="34">
        <animate attributeName="width" values="0;700;700;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background + grid -->
    <rect width="1200" height="320" fill="#0a0f14"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- moving scanline -->
    <rect x="0" y="-80" width="1200" height="80" fill="url(#scan)">
      <animate attributeName="y" values="-80;320" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- radar (left) -->
    <g transform="translate(120 160)">
      <circle r="62" fill="none" stroke="#0e75b6" stroke-opacity="0.45"/>
      <circle r="40" fill="none" stroke="#0e75b6" stroke-opacity="0.3"/>
      <circle r="18" fill="none" stroke="#0e75b6" stroke-opacity="0.3"/>
      <path d="M-62 0H62M0 -62V62" stroke="#0e75b6" stroke-opacity="0.25"/>
      <g>
        <path d="M0 0L62 0A62 62 0 0 0 43.8 -43.8Z" fill="url(#sweep)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
      <circle cx="28" cy="-22" r="3" fill="#6DB33F">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-34" cy="18" r="3" fill="#6DB33F">
        <animate attributeName="opacity" values="0;0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- rotating rings (right) -->
    <g transform="translate(1080 160)">
      <circle r="60" fill="none" stroke="#6DB33F" stroke-opacity="0.6" stroke-dasharray="6 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="44" fill="none" stroke="#0e75b6" stroke-opacity="0.7" stroke-dasharray="40 18">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="#6DB33F" fill-opacity="0.8">
        <animate attributeName="r" values="8;13;8" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="fill-opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text y="88" text-anchor="middle" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="11" fill="#6DB33F" fill-opacity="0.8" letter-spacing="2">JVM 21</text>
    </g>

    <!-- corner brackets -->
    <g fill="none" stroke="#6DB33F" stroke-width="3">
      <path d="M18 54V18H54"/>
      <path d="M1146 18H1182V54"/>
      <path d="M18 266V302H54"/>
      <path d="M1146 302H1182V266"/>
    </g>

    <!-- top HUD labels -->
    <g font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2">
      <text x="72" y="40" fill="#0e75b6">[ SYS://CHUONGPHAM2004 ]</text>
      <text x="1050" y="40" text-anchor="end" fill="#7ddbb4">STATUS: ONLINE</text>
      <circle cx="1068" cy="35" r="5" fill="#6DB33F">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name with glitch layers -->
    <g font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="56" font-weight="700" letter-spacing="6" text-anchor="middle">
      <text x="600" y="160" fill="#0e75b6" opacity="0">PHAM HOANG CHUONG
        <animate attributeName="opacity" values="0;0;0.8;0;0;0.6;0" keyTimes="0;0.62;0.64;0.66;0.9;0.92;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="600;600;594;600;600;607;600" keyTimes="0;0.62;0.64;0.66;0.9;0.92;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="160" fill="#6DB33F" opacity="0">PHAM HOANG CHUONG
        <animate attributeName="opacity" values="0;0;0.8;0;0;0.6;0" keyTimes="0;0.63;0.65;0.67;0.91;0.93;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="600;600;607;600;600;593;600" keyTimes="0;0.63;0.65;0.67;0.91;0.93;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="160" fill="#e8f5ef">PHAM HOANG CHUONG</text>
    </g>

    <!-- beam under name -->
    <rect x="300" y="178" width="600" height="2" fill="#1b3a4b"/>
    <rect x="300" y="177" width="160" height="4" fill="url(#beam)">
      <animate attributeName="x" values="300;740;300" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- typed subtitle -->
    <g clip-path="url(#typing)">
      <text x="600" y="214" text-anchor="middle" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="18" fill="#7ddbb4" letter-spacing="1">JAVA 21 BACKEND ENGINEER · MICROSERVICES · CI/CD · FLUTTER</text>
    </g>
    <rect x="252" y="196" width="10" height="22" fill="#6DB33F">
      <animate attributeName="x" values="252;950;950;252" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom stack ticker -->
    <g font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="13" fill="#35604d" letter-spacing="2" text-anchor="middle">
      <text x="600" y="268">SPRING BOOT 3 │ SPRING CLOUD │ KAFKA │ REDIS │ POSTGRESQL │ DOCKER │ K8S</text>
    </g>

    <!-- equalizer bars -->
    <g fill="#0e75b6">
      <rect x="72" y="282" width="4" height="12"><animate attributeName="height" values="4;16;8;4" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="80" y="282" width="4" height="12"><animate attributeName="height" values="12;4;16;12" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="88" y="282" width="4" height="12"><animate attributeName="height" values="8;16;4;8" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="96" y="282" width="4" height="12"><animate attributeName="height" values="16;8;12;16" dur="1s" repeatCount="indefinite"/></rect>
      <rect x="104" y="282" width="4" height="12"><animate attributeName="height" values="4;12;16;4" dur="1.2s" repeatCount="indefinite"/></rect>
    </g>
    <text x="1128" y="296" text-anchor="end" font-family="JetBrains Mono, Consolas, 'Courier New', monospace" font-size="12" fill="#35604d" letter-spacing="2">v21.0 · LTS</text>

    <!-- frame border -->
    <rect x="1" y="1" width="1198" height="318" rx="14" fill="none" stroke="#1b3a4b" stroke-width="2"/>
  </g>
</svg>
